name: Release AstroTune

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.2.0"
        required: true
        default: "v1.2.0"

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APKs
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Name the APKs
        run: |
          mkdir out
          for f in app/build/outputs/apk/release/*.apk; do
            b=$(basename "$f" | sed -E 's/^app-//; s/-release//; s/\.apk$//')
            cp "$f" "out/AstroTune-${VERSION}-${b}.apk"
          done
          ls -la out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" out/*.apk --target "${GITHUB_SHA}" \
            --title "AstroTune $VERSION" \
            --notes "AstroTune: reproductor de música 100 % privado y anónimo. Sin ubicación, sin micrófono, sin estadísticas, sin cuenta y sin rastreo: ningún dato tuyo sale del móvil. Fork de OpenTune (GPL-3.0). Instala el APK universal o el de tu arquitectura (arm64-v8a en casi todos los móviles actuales). Firmado con clave de depuración."
