name: Release AstroTune

# Un solo lanzamiento con descargas separadas para cada plataforma:
#   Android (móvil) · Android TV / Google TV · Windows · Linux · macOS
# Se lanza a mano (Actions → Release AstroTune → Run workflow) o con una etiqueta v*.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.4.0"
        required: true
        default: "v1.4.0"

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  android:
    name: Android (móvil + TV)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Build phone and TV APKs
        run: ./gradlew --no-daemon :app:assembleRelease :tv:assembleRelease
      - name: Name the files
        run: |
          mkdir out
          for f in app/build/outputs/apk/release/*.apk; do
            b=$(basename "$f" | sed -E 's/^app-//; s/-release//; s/\.apk$//')
            cp "$f" "out/AstroTune-${VERSION}-android-${b}.apk"
          done
          for f in tv/build/outputs/apk/release/*.apk; do
            cp "$f" "out/AstroTune-${VERSION}-android-tv.apk"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  pc:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            target: ""
            glob: "pc/target/release/bundle/nsis/*.exe"
            suffix: windows-x64
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
            target: ""
            glob: "pc/target/release/bundle/*/*.*"
            suffix: linux-x64
          - name: macOS (Apple Silicon)
            os: macos-latest
            bundles: dmg
            target: aarch64-apple-darwin
            glob: "pc/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"
            suffix: macos-apple-silicon
          - name: macOS (Intel)
            os: macos-latest
            bundles: dmg
            target: x86_64-apple-darwin
            glob: "pc/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg"
            suffix: macos-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: pc
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf file rpm
      - name: Build
        shell: bash
        working-directory: pc
        run: |
          ARGS="--bundles ${{ matrix.bundles }}"
          if [ -n "${{ matrix.target }}" ]; then ARGS="$ARGS --target ${{ matrix.target }}"; fi
          npx --yes @tauri-apps/cli@2 build $ARGS -- --locked
      - name: Name the files
        shell: bash
        run: |
          mkdir out
          shopt -s nullglob
          for f in ${{ matrix.glob }}; do
            [ -f "$f" ] || continue
            ext="${f##*.}"
            cp "$f" "out/AstroTune-${VERSION}-${{ matrix.suffix }}.${ext}"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: pc-${{ matrix.suffix }}
          path: out/*
          if-no-files-found: error

  audit:
    name: Auditoría de dependencias (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        working-directory: pc
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit

  publish:
    name: Publicar release
    needs: [android, pc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: Checksums
        run: |
          cd dl
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          **AstroTune: reproductor de música 100 % privado y anónimo.** Sin cuenta, sin ubicación, sin micrófono, sin estadísticas y sin rastreo: ningún dato tuyo sale de tu dispositivo.

          | Plataforma | Archivo |
          |---|---|
          | Android (móvil, Android Auto, Chromecast/DLNA) | `*-android-universal.apk` (o el de tu arquitectura; `arm64-v8a` en casi todos) |
          | Android TV / Google TV | `*-android-tv.apk` |
          | Windows 10/11 | `*-windows-x64.exe` |
          | Linux | `*-linux-x64.deb` / `.rpm` / `.AppImage` |
          | macOS Apple Silicon (M1+) | `*-macos-apple-silicon.dmg` |
          | macOS Intel | `*-macos-intel.dmg` |

          Comprueba la descarga con `SHA256SUMS.txt`. Las builds no están firmadas con certificado de pago: Windows SmartScreen y macOS Gatekeeper pueden avisar; en macOS, clic derecho → Abrir. Código abierto (GPL-3.0), fork de OpenTune.
          NOTES
          gh release create "$VERSION" dl/* --target "${GITHUB_SHA}" --title "AstroTune $VERSION" --notes-file notes.md
