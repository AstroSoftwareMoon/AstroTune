<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<title>AstroTune · Mando</title>
<style>
:root { --bg:#000; --s1:#1b1b1d; --s2:#242426; --fg:#f4eff4; --mu:#c9c4ca; --ac:#ff0aa0; --pri:color-mix(in srgb,var(--ac) 45%,#fff); --on:color-mix(in srgb,var(--ac) 35%,#000); --pc:#2a0f20; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--fg); font:400 15px/1.4 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif; }
body { min-height:100vh; background:radial-gradient(120% 70% at 50% -10%, var(--pc), #000 70%); transition:background 1s; padding:calc(14px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)); }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
svg { width:24px; height:24px; display:block; }
.top { display:flex; align-items:center; gap:10px; color:var(--mu); font-size:13px; }
.dot { width:8px; height:8px; border-radius:50%; background:#3ddc84; box-shadow:0 0 10px #3ddc84; }
.dot.off { background:#888; box-shadow:none; }
.cov { width:min(78vw,340px); aspect-ratio:1; border-radius:22px; object-fit:cover; display:block; margin:22px auto 18px; background:var(--s1); box-shadow:0 24px 70px rgba(0,0,0,.6); }
h1 { margin:0; font-size:22px; font-weight:500; } .ar { color:var(--mu); margin-top:2px; }
.bar { height:4px; border-radius:4px; background:rgba(255,255,255,.2); margin:18px 0 6px; overflow:hidden; } .bar i { display:block; height:100%; width:0; background:#fff; }
.times { display:flex; justify-content:space-between; font-size:12px; color:var(--mu); }
.ctl { display:flex; justify-content:space-evenly; align-items:center; margin:10px 0 6px; }
.ctl button svg { width:44px; height:44px; } .ctl .main svg { width:64px; height:64px; }
.vol { display:grid; grid-template-columns:22px 1fr 22px; gap:10px; align-items:center; color:var(--mu); margin:6px 0 18px; }
input[type=range] { width:100%; accent-color:#fff; }
.box { display:flex; align-items:center; gap:10px; height:50px; border-radius:999px; background:var(--s2); padding:0 16px; margin:8px 0 10px; }
.box input { flex:1; min-width:0; background:none; border:0; outline:0; color:var(--fg); font-size:16px; }
.row { display:grid; grid-template-columns:48px 1fr; gap:12px; align-items:center; padding:7px 4px; border-radius:12px; }
.row:active { background:rgba(255,255,255,.06); }
.row img { width:48px; height:48px; border-radius:6px; object-fit:cover; background:var(--s1); }
.t1 { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .t2 { color:var(--mu); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.now .t1 { color:var(--pri); }
h2 { font-size:20px; font-weight:500; margin:22px 0 8px; }
.note { color:var(--mu); font-size:12px; text-align:center; margin-top:28px; line-height:1.5; }
.tabs { display:flex; gap:8px; margin-top:8px; } .tabs button { height:34px; padding:0 16px; border-radius:999px; background:var(--s2); font-weight:500; font-size:13.5px; } .tabs button.on { background:var(--fg); color:#000; }
</style>
</head>
<body>
<div class="top"><span class="dot" id="dot"></span><span id="conn">AstroTune</span></div>
<img class="cov" id="cov" alt="">
<h1 id="title">—</h1><div class="ar" id="artist"></div>
<div class="bar"><i id="prog"></i></div>
<div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<div class="ctl">
  <button data-c="prev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6.5v11a.6.6 0 0 1-1 .45L3.4 12.45a.6.6 0 0 1 0-.9L10 6.05a.6.6 0 0 1 1 .45zm10 0v11a.6.6 0 0 1-1 .45l-6.6-5.5a.6.6 0 0 1 0-.9L20 6.05a.6.6 0 0 1 1 .45z"/></svg></button>
  <button class="main" data-c="toggle" id="pp"></button>
  <button data-c="next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6.5v11a.6.6 0 0 0 1 .45l6.6-5.5a.6.6 0 0 0 0-.9L14 6.05a.6.6 0 0 0-1 .45zm-10 0v11a.6.6 0 0 0 1 .45l6.6-5.5a.6.6 0 0 0 0-.9L4 6.05a.6.6 0 0 0-1 .45z"/></svg></button>
</div>
<div class="vol"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h3l4-4v14l-4-4H4z"/></svg><input type="range" id="vol" min="0" max="100"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h3l4-4v14l-4-4H4z" fill="currentColor" stroke="none"/><path d="M15 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></svg></div>
<div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="" autocomplete="off"></div>
<div class="tabs"><button class="on" data-t="res" id="tres"></button><button data-t="queue" id="tqueue"></button></div>
<div id="list"></div>
<p class="note" id="note"></p>
<script>
"use strict";
const T = "__TOKEN__";
const ES = (navigator.language || "es").toLowerCase().startsWith("es");
const L = ES ? { search: "Busca para reproducir en el ordenador", res: "Resultados", queue: "Cola", on: "Conectado a AstroTune", off: "Sin conexión con el ordenador", note: "Este mando funciona solo en tu red wifi y no envía nada fuera de ella. Nada se instala en tu móvil.", nothing: "No suena nada todavía", empty: "Busca algo y tócalo para que suene en el ordenador." }
  : { search: "Search to play on the computer", res: "Results", queue: "Queue", on: "Connected to AstroTune", off: "Can't reach the computer", note: "This remote works only on your Wi-Fi and sends nothing outside it. Nothing is installed on your phone.", nothing: "Nothing playing yet", empty: "Search for something and tap it to play it on the computer." };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.2" height="16" rx="1.2"/><rect x="13.8" y="4" width="4.2" height="16" rx="1.2"/></svg>';
$("#pp").innerHTML = PLAY; $("#pp").innerHTML = PLAY; $("#q").placeholder = L.search; $("#tres").textContent = L.res; $("#tqueue").textContent = L.queue; $("#note").textContent = L.note;
let st = {}, results = [], tab = "res", volBusy = false;
async function cmd(body) { try { const r = await fetch(`/api/${T}/cmd`, { method: "POST", body: JSON.stringify(body) }); return await r.json(); } catch { return {}; } }
document.querySelectorAll("[data-c]").forEach((b) => (b.onclick = () => cmd({ cmd: b.dataset.c })));
$("#vol").oninput = () => { volBusy = true; cmd({ cmd: "volume", value: $("#vol").value / 100 }); clearTimeout(volBusy.t); };
$("#vol").onchange = () => setTimeout(() => (volBusy = false), 800);
document.querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => { tab = b.dataset.t; document.querySelectorAll("[data-t]").forEach((x) => x.classList.toggle("on", x === b)); list(); }));
let qt; $("#q").oninput = () => { clearTimeout(qt); qt = setTimeout(async () => { const q = $("#q").value.trim(); if (!q) { results = []; return list(); } const r = await cmd({ cmd: "search", q }); results = r.results || []; tab = "res"; document.querySelectorAll("[data-t]").forEach((x) => x.classList.toggle("on", x.dataset.t === "res")); list(); }, 350); };
function list() {
  const items = tab === "res" ? results : st.queue || [];
  $("#list").innerHTML = items.length ? items.map((t, i) => `<div class="row${st.track && st.track.id === t.id ? " now" : ""}" data-i="${i}"><img src="${esc(t.cover || "")}" alt="" loading="lazy"><div style="min-width:0"><div class="t1">${esc(t.title)}</div><div class="t2">${esc(t.artist)}</div></div></div>`).join("") : `<p class="note" style="margin-top:14px">${tab === "res" ? L.empty : ""}</p>`;
  $("#list").querySelectorAll(".row").forEach((r) => (r.onclick = () => { const i = +r.dataset.i; if (tab === "res") cmd({ cmd: "playList", tracks: results, index: i }); else cmd({ cmd: "playIndex", index: i }); }));
}
async function poll() {
  try {
    const r = await fetch(`/api/${T}/state`, { cache: "no-store" }); st = await r.json();
    $("#dot").classList.remove("off"); $("#conn").textContent = L.on + (st.device ? " · " + st.device : "");
    const t = st.track;
    $("#title").textContent = t ? t.title : L.nothing; $("#artist").textContent = t ? t.artist : "";
    if (t && t.cover && $("#cov").getAttribute("src") !== t.cover) $("#cov").src = t.cover;
    if (st.color) document.body.style.setProperty("--pc", st.color);
    if (st.accent) document.documentElement.style.setProperty("--ac", st.accent);
    const d = (t && t.duration) || 0; $("#prog").style.width = d ? Math.min(100, (st.pos / d) * 100) + "%" : "0";
    $("#cur").textContent = fmt(st.pos); $("#dur").textContent = fmt(d); $("#pp").innerHTML = st.playing ? PAUSE : PLAY;
    if (!volBusy && st.volume != null) $("#vol").value = Math.round(st.volume * 100);
    if (tab === "queue") list();
  } catch { $("#dot").classList.add("off"); $("#conn").textContent = L.off; }
  setTimeout(poll, 1000);
}
list(); poll();
</script>
</body>
</html>
