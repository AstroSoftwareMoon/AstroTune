[package]
name = "astrotune"
version = "1.8.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "AstroTune for PC: a private, anonymous music player"

[lib]
name = "astrotune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
astrotune-core = { path = "../core" }
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.2"
# AstroTune's own local server: audio for the window, the phone remote and speakers on the network.
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Casting: Google Cast (mDNS + TLS) and DLNA (SSDP + SOAP), all on the local network only.
mdns-sd = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }

# Desktop plays through rodio; on Android the web view plays the cached file.
[target.'cfg(not(target_os = "android"))'.dependencies]
rodio = { version = "0.23", default-features = false, features = ["playback", "mp4", "mp3", "flac", "vorbis"] }
