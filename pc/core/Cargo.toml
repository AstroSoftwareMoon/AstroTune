[package]
name = "astrotune-core"
version = "1.8.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "AstroTune PC core: music client, library store and privacy log. No telemetry."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same HTTP client rustypipe already uses: for the player request and the audio bytes.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["fs", "io-util"] }

# Desktop reads the system certificate store; Android has no usable one for rustls, so it bundles roots.
[target.'cfg(not(target_os = "android"))'.dependencies]
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-native-roots"] }

[target.'cfg(target_os = "android")'.dependencies]
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-webpki-roots"] }
# No prebuilt QuickJS bindings exist for Android targets, so they are generated while building.
rquickjs = { version = "0.9", features = ["bindgen"] }
