<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AstroTune</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="tint"></div>
<div id="topfade"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="liquid-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB" primitiveUnits="objectBoundingBox"><feImage id="lens-map" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="map"/><feDisplacementMap in="SourceGraphic" in2="map" scale="0.09" xChannelSelector="R" yChannelSelector="G"/></filter></svg>


<div id="app">
  <nav id="rail" class="chrome glass">
    <div class="mark" id="rail-mark"></div>
    <button class="tab" data-tab="home"><span class="ic o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><span class="ic f"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><b data-tr="home"></b></button>
    <button class="tab" data-tab="explore"><span class="ic o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg></span><span class="ic f"><svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.2 5.8-2.4 6-6 2.4 2.4-6z"/></svg></span><b data-tr="explore"></b></button>
    <button class="tab" data-tab="library"><span class="ic o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16M8 4v16"/><rect x="12" y="4" width="8" height="16" rx="1.5" transform="rotate(-8 16 12)"/></svg></span><span class="ic f"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h2.4v16H3zm4 0h2.4v16H7z"/><rect x="12" y="4" width="8" height="16" rx="1.5" transform="rotate(-8 16 12)"/></svg></span><b data-tr="library"></b></button>
    <button class="tab" data-tab="search"><span class="ic o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span><span class="ic f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span><b data-tr="search"></b></button>
  </nav>
  <main id="page"></main>
</div>

<div id="chrome">
  <div id="mini" class="glass hidden">
    <img id="mini-cov" alt="">
    <div class="mi"><div id="mini-title" class="t1"></div><div id="mini-artist" class="t2"></div></div>
    <div class="mr">
      <input type="range" id="vol" min="0" max="100" value="80" class="pc-only">
      <button class="ib" id="mini-prev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zm14 0v14L9 12z"/></svg></button>
      <button class="ib big" id="mini-pp"><span class="pp"></span></button>
      <button class="ib" id="mini-next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <div id="mini-prog"><i></i></div>
  </div>
  <div id="dockrow">
    <nav id="dock" class="glass">
      <button class="tab" data-tab="home"><span class="ic o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><span class="ic f"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><b data-tr="home"></b></button>
      <button class="tab" data-tab="explore"><span class="ic o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg></span><span class="ic f"><svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.2 5.8-2.4 6-6 2.4 2.4-6z"/></svg></span><b data-tr="explore"></b></button>
      <button class="tab" data-tab="library"><span class="ic o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16M8 4v16"/><rect x="12" y="4" width="8" height="16" rx="1.5" transform="rotate(-8 16 12)"/></svg></span><span class="ic f"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h2.4v16H3zm4 0h2.4v16H7z"/><rect x="12" y="4" width="8" height="16" rx="1.5" transform="rotate(-8 16 12)"/></svg></span><b data-tr="library"></b></button>
    </nav>
    <button id="orb" class="glass" data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </div>
</div>

<section id="player" aria-hidden="true">
  <div id="pl-bg"><img id="pl-blur" alt=""></div>
  <div id="pl-in"></div>
</section>

<div id="sheet-scrim"></div>
<div id="sheet" class="glass"></div>
<div id="toast"></div>

<canvas id="opening"></canvas>
<script src="es.js"></script>
<script src="app.js"></script>
</body>
</html>
