[package]
name = "astrotune"
version = "1.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "AstroTune for PC: a private, anonymous music player"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
astrotune-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp4", "mp3", "flac", "vorbis"] }
