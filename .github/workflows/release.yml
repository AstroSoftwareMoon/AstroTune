name: Release AstroTune

# Un solo lanzamiento con descargas separadas para cada plataforma:
#   Android (móvil) · Android TV / Google TV · Windows · Linux · macOS
# Se lanza a mano (Actions → Release AstroTune → Run workflow) o con una etiqueta v*.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.4.0"
        required: true
        default: "v1.4.0"

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  android:
    name: Android (móvil + TV)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - name: Build phone and TV APKs
        run: ./gradlew --no-daemon :app:assembleRelease :tv:assembleRelease
      - name: Name the files
        run: |
          mkdir out
          for f in app/build/outputs/apk/release/*.apk; do
            b=$(basename "$f" | sed -E 's/^app-//; s/-release//; s/\.apk$//')
            cp "$f" "out/AstroTune-${VERSION}-android-${b}.apk"
          done
          for f in tv/build/outputs/apk/release/*.apk; do
            cp "$f" "out/AstroTune-${VERSION}-android-tv.apk"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            tasks: :desktop:packageMsi :desktop:packageExe
          - name: Linux
            os: ubuntu-latest
            tasks: :desktop:packageDeb :desktop:packageRpm
          - name: macOS (Apple Silicon)
            os: macos-latest
            tasks: :desktop:packageDmg
          - name: macOS (Intel)
            os: macos-15-intel
            tasks: :desktop:packageDmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The build includes the Android modules, which need the SDK to configure.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: RPM tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build installers
        shell: bash
        run: ./gradlew --no-daemon ${{ matrix.tasks }} :desktop:createDistributable
      - name: Name the files
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/desktop" && mkdir -p "$out"
          bin=desktop/build/compose/binaries/main
          case "$RUNNER_OS" in
            Linux)
              cp "$bin"/deb/*.deb "$out/AstroTune-$VERSION-linux-amd64.deb"
              cp "$bin"/rpm/*.rpm "$out/AstroTune-$VERSION-linux-x86_64.rpm"
              tar -C "$bin/app" -czf "$out/AstroTune-$VERSION-linux-x86_64-portable.tar.gz" AstroTune
              ;;
            Windows)
              cp "$bin"/msi/*.msi "$out/AstroTune-$VERSION-windows-x64.msi"
              cp "$bin"/exe/*.exe "$out/AstroTune-$VERSION-windows-x64-setup.exe"
              pwsh -NoProfile -Command "Compress-Archive -Path '$bin/app/AstroTune' -DestinationPath '$out/AstroTune-$VERSION-windows-x64-portable.zip'"
              ;;
            macOS)
              arch=$(uname -m | sed 's/x86_64/intel/; s/arm64/apple-silicon/')
              cp "$bin"/dmg/*.dmg "$out/AstroTune-$VERSION-macos-$arch.dmg"
              ;;
          esac
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ runner.temp }}/desktop/*
          if-no-files-found: error

  publish:
    name: Publicar release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: Checksums
        run: |
          cd dl
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$VERSION" dl/* --target "${GITHUB_SHA}" --title "AstroTune $VERSION" --notes-file .github/release-notes.md
