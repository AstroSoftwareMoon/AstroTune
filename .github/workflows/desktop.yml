name: Desktop AstroTune

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag for the desktop downloads, e.g. desktop-v1.3.1"
        required: true
        default: "desktop-v1.3.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: :desktop:packageDeb :desktop:packageRpm
          - os: windows-latest
            tasks: :desktop:packageMsi :desktop:packageExe
          - os: macos-latest
            tasks: :desktop:packageDmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      TAG: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The build includes the Android modules, which need the SDK to configure.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4
      - name: RPM tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build installers
        shell: bash
        run: ./gradlew --no-daemon ${{ matrix.tasks }} :desktop:createDistributable
      - name: Name the files
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/desktop" && mkdir -p "$out"
          bin=desktop/build/compose/binaries/main
          case "$RUNNER_OS" in
            Linux)
              cp "$bin"/deb/*.deb "$out/AstroTune-$TAG-linux-amd64.deb"
              cp "$bin"/rpm/*.rpm "$out/AstroTune-$TAG-linux-x86_64.rpm"
              tar -C "$bin/app" -czf "$out/AstroTune-$TAG-linux-x86_64-portable.tar.gz" AstroTune
              ;;
            Windows)
              cp "$bin"/msi/*.msi "$out/AstroTune-$TAG-windows-x64.msi"
              cp "$bin"/exe/*.exe "$out/AstroTune-$TAG-windows-x64-setup.exe"
              pwsh -NoProfile -Command "Compress-Archive -Path '$bin/app/AstroTune' -DestinationPath '$out/AstroTune-$TAG-windows-x64-portable.zip'"
              ;;
            macOS)
              cp "$bin"/dmg/*.dmg "$out/AstroTune-$TAG-macos-$(uname -m | sed 's/x86_64/x64/').dmg"
              ;;
          esac
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: ${{ runner.temp }}/desktop/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version }}
        run: |
          ls -la files
          gh release create "$TAG" files/* --repo "${{ github.repository }}" --target "${GITHUB_SHA}" \
            --title "AstroTune para PC $TAG" \
            --notes "AstroTune para Windows, macOS y Linux: reproductor de música 100 % privado y anónimo. Sin ubicación, sin estadísticas, sin cuenta y sin rastreo. Fork de OpenTune (GPL-3.0). Sin firmar: Windows y macOS pueden pedir confirmación al abrirlo."
