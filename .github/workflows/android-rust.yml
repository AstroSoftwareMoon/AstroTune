name: Android Rust (beta)

# Builds only the Rust/Tauri Android APK. Handy to retry it, and can attach it to an existing release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag the APK is named after (and attached to if 'attach' is true), e.g. v1.7.0"
        required: true
        default: "v1.7.0"
      attach:
        description: "Attach the APK to that existing release"
        type: boolean
        default: false

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  apk:
    name: Android (Rust, beta)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018
      - name: libclang for bindgen
        run: sudo apt-get update && sudo apt-get install -y libclang-dev clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: pc
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        working-directory: pc
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          SYSROOT="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$SYSROOT -I$SYSROOT/usr/include/aarch64-linux-android"
          export BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi="--sysroot=$SYSROOT -I$SYSROOT/usr/include/arm-linux-androideabi"
          npm ci --ignore-scripts
          npx tauri android init --ci
          # Same launcher icon as the Kotlin app (adaptive: black background, AstroTune mark, themed monochrome).
          npx tauri icon src-tauri/icons/app-icon.png
          RES=src-tauri/gen/android/app/src/main/res
          rm -f $RES/mipmap-anydpi-v26/ic_launcher*.xml $RES/drawable*/ic_launcher_background.xml $RES/drawable*/ic_launcher_foreground.*
          cp -r android-res/. $RES/
          find $RES -name "ic_launcher*" | sort
          npx tauri android build --apk --target aarch64 --target armv7 --ci
      - name: Sign (debug key) and name
        run: |
          mkdir out
          APK=$(find pc/src-tauri/gen/android -name "*universal*release*.apk" | head -1)
          echo "APK: $APK"
          keytool -genkeypair -keystore ks.jks -alias astro -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass astrotune -keypass astrotune -dname "CN=AstroTune"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass pass:astrotune --out "out/AstroTune-${VERSION}-android-rust-beta.apk" aligned.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android-rust
          path: out/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: ${{ github.event.inputs.attach == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$VERSION" out/*.apk --clobber
